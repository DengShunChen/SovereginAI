[project]
name = "sovereign-ai"
version = "0.1.0"
description = "台灣氣象主權 AI — 語料管線與 Llama LoRA 訓練"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "schedule>=1.2.0",
    "beautifulsoup4>=4.12.0",
    "datasets>=2.14.0",
    "huggingface_hub>=0.24.0",
]

[project.optional-dependencies]
cu124 = [
    "torch>=2.6.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "peft>=0.13.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
]
mlx = [
    "mlx>=0.24.0",
    "mlx-lm[train]>=0.21.0",
]

[tool.uv]
package = false
conflicts = [
    [{ extra = "cu124" }, { extra = "mlx" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
